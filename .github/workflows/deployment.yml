name: Deploy Application
run-name: ${{ github.actor }} is deploying project 🚀
on:
  push:
  workflow_dispatch:
jobs:
  Create-folder:
    name: Create Folder on Server
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote SSH commands
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username:  ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            mkdir -p /opt/serge-mane/ms-serge-mane
  build-project:
    runs-on: ubuntu-latest
    needs: Create-folder
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Setup java version
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Make mvnw executable
        run: chmod +x mvnw
      - name: build project
        run: |
          ./mvnw clean package spring-boot:repackage -Dmaven.test.skip=true
          ls -al target
      - name: Rename project
        run: |
          mv target/ms-naissances-*.jar target/ms-naissances.jar
      - name: Copy files on sever
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: target/ms-naissances.jar
          target: /opt/serge-mane/ms-serge-mane
          strip_components: 1
          overwrite: true
  run-project:
    name: Create Folder on Server
    needs: build-project
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote SSH commands
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            echo "Vérification des secrets..."
            echo "MAIL_HOST=${{secrets.MAIL_HOST}}"
            echo "DATABASE_URL=${{secrets.DATABASE_URL}}"
            echo "DATABASE_USERNAME=${{secrets.DATABASE_USERNAME}}"
            echo "DATABASE_USERPASSWORD=${{secrets.DATABASE_USERPASSWORD}}"
            
            chmod +x /opt/serge-mane/ms-serge-mane/ms-naissances.jar
            ln -sf /opt/serge-mane/ms-serge-mane/ms-naissances.jar /etc/init.d/ms-naissances
            /etc/init.d/ms-naissances stop
             /etc/init.d/ms-naissances start --spring.mail.host=${{secrets.MAIL_HOST}} --spring.datasource.username=${{secrets.DATABASE_USERNAME}} --spring.datasource.password=${{secrets.DATABASE_USERPASSWORD}} --spring.datasource.url=${{secrets.DATABASE_URL}} --spring.sql.init.mode=always

